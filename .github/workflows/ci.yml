name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout dondron
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-jazzy-behaviortree-cpp \
            ros-jazzy-vision-msgs \
            ros-jazzy-cv-bridge \
            ros-jazzy-launch-testing \
            ros-jazzy-launch-testing-ament-cmake
          rosdep init 2>/dev/null || true
          rosdep update

      - name: Clone px4_msgs
        run: |
          git clone --depth 1 https://github.com/PX4/px4_msgs.git ros2_ws/src/px4_msgs

      - name: Public boundary check
        run: |
          chmod +x scripts/check-public-boundary.sh
          ./scripts/check-public-boundary.sh

      - name: rosdep install
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          rosdep install --from-paths src --ignore-src -r -y

      - name: colcon build
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --symlink-install \
            --packages-select \
              dondron_description \
              dondron_bridge \
              dondron_perception \
              dondron_flight_api \
              dondron_state_machine \
              dondron_bringup \
              px4_msgs

      - name: colcon test
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          colcon test \
            --packages-select \
              dondron_description \
              dondron_bridge \
              dondron_perception \
              dondron_flight_api \
              dondron_state_machine \
              dondron_bringup
          colcon test-result --verbose
